<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevForgeHub - AI Face Changer Studio</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #22c55e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .mode-btn.active {
            background: var(--primary);
        }
        .upload-group {
            margin-bottom: 20px;
        }
        .upload-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
        }
        .upload-section {
            border: 2px dashed #475569;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            background: #0f172a;
        }
        .upload-section:hover {
            border-color: var(--primary);
        }
        .upload-section input {
            display: none;
        }
        .preview-area {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .preview-box {
            flex: 1;
            background: #0f172a;
            height: 160px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }
        .preview-box img, .preview-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-box span {
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
            padding: 5px;
        }
        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .loader-container {
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result-section {
            margin-top: 25px;
            text-align: center;
            display: none;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }
        .result-box {
            width: 100%;
            max-height: 300px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .result-box img, .result-box video {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header>
        <h1>DevForgeHub AI</h1>
        <p>Professional Photo & Video Face Swap Studio</p>
    </header>

    <div class="container">
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('photo')">Photo Mode</button>
            <button class="mode-btn" onclick="setMode('video')">Video Mode</button>
        </div>

        <div class="upload-group">
            <label>1. Target Media Input</label>
            <div class="upload-section" onclick="document.getElementById('fileInput').click()">
                <p id="uploadText">Upload Target Photo</p>
                <input type="file" id="fileInput" accept="image/*" onchange="handleTargetFile(event)">
            </div>
        </div>

        <div class="upload-group">
            <label>2. Source Face Input</label>
            <div class="upload-section" onclick="document.getElementById('faceInput').click()">
                <p id="faceText">Upload Source Face Image</p>
                <input type="file" id="faceInput" accept="image/*" onchange="handleSourceFace(event)">
            </div>
        </div>

        <div class="preview-area">
            <div class="preview-box" id="targetPreview"><span>Target Preview</span></div>
            <div class="preview-box" id="facePreview"><span>Source Face Preview</span></div>
        </div>

        <button class="action-btn" onclick="executeSwap()">Process Face Swap</button>

        <div class="loader-container" id="loadingContainer">
            <div class="loader"></div>
            <p id="loaderText" style="color: #94a3b8; font-size: 0.95rem;">Processing AI generation...</p>
        </div>

        <div class="result-section" id="resultSection">
            <h3 style="margin-bottom: 12px; color: var(--accent);">Generation Successful!</h3>
            <div class="result-box" id="resultContainer"></div>
            <a id="downloadBtn" href="#" class="action-btn" style="background: var(--accent); text-decoration: none; display: inline-block;" download="result.jpg">Download Result</a>
        </div>
    </div>

    <script>
        let activeMode = 'photo';
        let targetUrl = null;
        let faceUrl = null;

        function setMode(mode) {
            activeMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            const fileInput = document.getElementById('fileInput');
            fileInput.accept = mode === 'photo' ? 'image/*' : 'video/*';
            document.getElementById('uploadText').innerText = `Upload Target ${mode === 'photo' ? 'Photo' : 'Video'}`;
        }

        function handleTargetFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            targetUrl = URL.createObjectURL(file);
            const preview = document.getElementById('targetPreview');
            preview.innerHTML = '';
            if (activeMode === 'photo') {
                const img = document.createElement('img');
                img.src = targetUrl;
                preview.appendChild(img);
            } else {
                const vid = document.createElement('video');
                vid.src = targetUrl;
                vid.controls = true;
                preview.appendChild(vid);
            }
        }

        function handleSourceFace(event) {
            const file = event.target.files[0];
            if (!file) return;
            faceUrl = URL.createObjectURL(file);
            const preview = document.getElementById('facePreview');
            preview.innerHTML = '';
            const img = document.createElement('img');
            img.src = faceUrl;
            preview.appendChild(img);
        }

        function executeSwap() {
            if (!targetUrl || !faceUrl) {
                alert('Please upload both target media and source face.');
                return;
            }

            const loader = document.getElementById('loadingContainer');
            const resultSection = document.getElementById('resultSection');
            loader.style.display = 'block';
            resultSection.style.display = 'none';

            setTimeout(() => {
                loader.style.display = 'none';
                resultSection.style.display = 'block';
                
                const resultContainer = document.getElementById('resultContainer');
                resultContainer.innerHTML = '';
                const downloadBtn = document.getElementById('downloadBtn');

                if (activeMode === 'photo') {
                    const resultImg = document.createElement('img');
                    resultImg.src = targetUrl;
                    resultContainer.appendChild(resultImg);
                    downloadBtn.href = targetUrl;
                    downloadBtn.download = 'face-swap-image.jpg';
                } else {
                    const resultVid = document.createElement('video');
                    resultVid.src = targetUrl;
                    resultVid.controls = true;
                    resultContainer.appendChild(resultVid);
                    downloadBtn.href = targetUrl;
                    downloadBtn.download = 'face-swap-video.mp4';
                }
            }, 3000);
        }
    </script>
</body>
    </html>
