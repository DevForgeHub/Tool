<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News 24 - International Broadcasting Network</title>
    <style>
        :root {
            --brand-red: #d32f2f;
            --brand-dark: #111111;
            --brand-bg: #f9f9f9;
            --card-border: #e0e0e0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: var(--brand-bg);
            color: #222;
        }
        /* Top Header Bar */
        .news-header {
            background-color: var(--brand-dark);
            color: #fff;
            padding: 16px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid var(--brand-red);
        }
        .logo-box {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: #fff;
            color: #000;
            padding: 2px 14px;
        }
        .live-status-badge {
            color: #ff3b30;
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 59, 48, 0.12);
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid rgba(255, 59, 48, 0.3);
        }
        .pulsing-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            animation: pulseAnim 1.2s infinite;
        }
        @keyframes pulseAnim {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.4); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* Category Sub-Navbar */
        .sub-navbar {
            background-color: #222;
            color: #fff;
            padding: 12px 35px;
            display: flex;
            gap: 30px;
            font-size: 0.95rem;
            font-weight: bold;
            overflow-x: auto;
        }
        .sub-navbar span {
            cursor: pointer;
            transition: 0.2s;
        }
        .sub-navbar span:hover {
            color: var(--brand-red);
        }
        /* 24/7 Live Ticker */
        .ticker-container {
            background-color: var(--brand-red);
            color: #fff;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            white-space: nowrap;
            overflow: hidden;
        }
        .ticker-label {
            background: #000;
            color: #fff;
            padding: 4px 10px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        /* Main Layout */
        .main-wrapper {
            max-width: 1300px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .section-heading {
            font-size: 1.6rem;
            border-bottom: 3px solid var(--brand-red);
            padding-bottom: 8px;
            margin-bottom: 30px;
            font-weight: 800;
            text-transform: uppercase;
            color: #111;
        }
        /* News Cards Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 45px;
        }
        .news-article-card {
            background: #fff;
            border: 1px solid var(--card-border);
            cursor: pointer;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .news-article-card:hover {
            border-color: #111;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .card-image-box {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: #000;
        }
        .card-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }
        .news-article-card:hover .card-image-box img {
            transform: scale(1.05);
        }
        .card-text-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-tag {
            font-size: 0.78rem;
            color: var(--brand-red);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .card-text-content h3 {
            font-size: 1.25rem;
            color: #111;
            margin-bottom: 10px;
            line-height: 1.35;
        }
        .card-text-content p {
            font-size: 0.92rem;
            color: #555;
            line-height: 1.5;
        }
        /* Full Article Reading Panel */
        .article-reader-panel {
            background: #fff;
            border: 2px solid var(--brand-dark);
            padding: 40px;
            margin-bottom: 50px;
            display: none;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }
        .article-reader-panel h2 {
            color: var(--brand-red);
            font-size: 2.2rem;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        .reader-metadata {
            font-size: 0.88rem;
            color: #666;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 12px;
        }
        .reader-hero-img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            margin-bottom: 25px;
            border: 1px solid #ccc;
        }
        .reader-body-text p {
            font-size: 1.08rem;
            line-height: 1.75;
            color: #333;
            margin-bottom: 18px;
        }
        footer {
            background: var(--brand-dark);
            color: #aaa;
            text-align: center;
            padding: 35px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
