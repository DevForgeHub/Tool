<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News 24 - International Defense & Community Network</title>
    <style>
        :root {
            --news-red: #cc0000;
            --news-dark: #121212;
            --news-gray: #f8f9fa;
            --border-color: #e0e0e0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: #fff;
            color: #222;
        }
        /* Channel Header */
        .channel-header {
            background-color: var(--news-dark);
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid var(--news-red);
        }
        .channel-logo {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: #fff;
            color: #000;
            padding: 2px 14px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .live-badge {
            color: #ff3b30;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 59, 48, 0.1);
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid rgba(255, 59, 48, 0.3);
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            animation: pulseGlow 1.2s infinite;
        }
        @keyframes pulseGlow {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* Breaking News Ticker Bar (24/7 Continuous) */
        .breaking-ticker {
            background-color: var(--news-red);
            color: #fff;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            overflow: hidden;
            white-space: nowrap;
        }
        .breaking-tag {
            background: #000;
            color: #fff;
            padding: 4px 10px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .ticker-content {
            display: inline-block;
            animation: tickerScroll 25s linear infinite;
        }
        @keyframes tickerScroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        /* Navigation Categories */
        .sub-nav {
            background: #222;
            color: #fff;
            padding: 10px 30px;
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            overflow-x: auto;
        }
        .sub-nav span {
            cursor: pointer;
            transition: 0.2s;
        }
        .sub-nav span:hover {
            color: var(--news-red);
        }
        /* Main Layout Grid */
        .container {
            max-width: 1280px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 30px;
        }
        @media(max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
        .section-title {
            font-size: 1.5rem;
            border-bottom: 3px solid var(--news-red);
            padding-bottom: 8px;
            margin-bottom: 20px;
            font-weight: 800;
            text-transform: uppercase;
        }
        /* News Feed Section */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .news-card {
            background: #fff;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .news-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            border-color: #111;
        }
        .card-img-wrap {
            width: 100%;
            height: 180px;
            overflow: hidden;
            background: #111;
        }
        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-content {
            padding: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-category {
            font-size: 0.75rem;
            color: var(--news-red);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .card-content h3 {
            font-size: 1.15rem;
            color: #111;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .card-content p {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.4;
        }
        /* Interactive Community Groups Sidebar */
        .sidebar-box {
            background: var(--news-gray);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 30px;
        }
        .sidebar-box h3 {
            font-size: 1.2rem;
            border-bottom: 2px solid var(--news-red);
            padding-bottom: 6px;
            margin-bottom: 15px;
            color: #111;
            text-transform: uppercase;
        }
        .group-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .group-form input, .group-form textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
            width: 100%;
        }
