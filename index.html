<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Defense & Aerospace Intelligence Desk</title>
    <style>
        :root {
            --bbc-red: #bb1919;
            --bbc-dark: #141414;
            --bbc-gray: #f6f6f6;
            --border-color: #d1d1d1;
            --text-main: #222;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: #fff;
            color: var(--text-main);
            min-height: 100vh;
        }
        /* Top News Channel Header */
        .top-bar {
            background-color: var(--bbc-dark);
            color: white;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--bbc-red);
        }
        .logo-area {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: #fff;
            color: #000;
            padding: 2px 10px;
            display: inline-block;
        }
        .header-badges {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .pride-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #fff;
        }
        .pride-flag-bar {
            width: 28px;
            height: 14px;
            border-radius: 2px;
            background: linear-gradient(to bottom, #e40303, #ff8c00, #ffed00, #008026, #004dff, #750787);
        }
        .live-status {
            color: #ff4d4d;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ff4d4d;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .sub-nav {
            background-color: #222;
            color: #fff;
            padding: 10px 25px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }
        .section-title {
            font-size: 1.4rem;
            border-bottom: 3px solid var(--bbc-red);
            padding-bottom: 6px;
            margin-bottom: 25px;
            font-weight: 700;
            color: #111;
            text-transform: uppercase;
        }
        /* News Grid Layout */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }
        .news-card {
            background: #fff;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }
        .news-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            border-color: #111;
        }
        .news-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .news-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .news-content h3 {
            font-size: 1.15rem;
            color: #111;
            margin-bottom: 8px;
            line-height: 1.35;
        }
        .meta-tag {
            font-size: 0.75rem;
            color: var(--bbc-red);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .news-content p {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.45;
        }
        /* Detailed Article/Report View */
        .article-view {
            background: var(--bbc-gray);
            border: 2px solid var(--bbc-dark);
            padding: 30px;
            margin-bottom: 40px;
            display: none;
        }
        .article-view h2 {
            color: var(--bbc-red);
            font-size: 1.9rem;
            margin-bottom: 10px;
        }
        .article-meta {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 20px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }
        .article-body {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .article-body { grid-template-columns: 1fr; }
        }
        .article-text p {
            font-size: 1.02rem;
            line-height: 1.65;
            color: #222;
            margin-bottom: 16px;
        }
        .article-stats {
            background: #fff;
            border-left: 4px solid var(--bbc-red);
            padding: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #ddd;
        }
        .article-stats h4 {
            margin-bottom: 12px;
            color: #111;
            font-size: 1.05rem;
        }
        .article-stats ul {
            list-style: none;
        }
        .article-stats ul li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
            color: #444;
        }
        .article-img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }
        /* Ticker Bar */
        .ticker-bar {
            background: #111;
            color: #fff;
            padding: 12px 25px;
            font-size: 0.9rem;
            border-top: 2px solid var(--bbc-red);
            margin-top: 40px;
            letter-spacing: 0.5px;
        }
        footer {
            background: #000;
            color: #aaa;
            text-align: center;
            padding: 25px;
            font-size: 0.85rem;
        }
    </style>
</head>
