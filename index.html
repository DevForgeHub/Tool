<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevForgeHub - AI Face Changer Pro</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .mode-btn.active {
            background: var(--primary);
        }
        .upload-section {
            border: 2px dashed #475569;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-section:hover {
            border-color: var(--primary);
        }
        .upload-section input {
            display: none;
        }
        .preview-area {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .preview-box {
            flex: 1;
            background: #0f172a;
            height: 150px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }
        .preview-box img, .preview-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-box span {
            color: #64748b;
            font-size: 0.9rem;
        }
        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .result-section {
            margin-top: 25px;
            text-align: center;
            display: none;
        }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>DevForgeHub AI</h1>
        <p>Advanced Photo & Video Face Changer Studio</p>
    </header>

    <div class="container">
        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('photo')">Photo Face Swap</button>
            <button class="mode-btn" onclick="switchMode('video')">Video Face Swap</button>
        </div>

        <div class="upload-section" onclick="document.getElementById('fileInput').click()">
            <p id="uploadText">📁 Click to upload Target Photo / Video</p>
            <input type="file" id="fileInput" accept="image/*,video/*" onchange="handleFile(event)">
        </div>

        <div class="upload-section" onclick="document.getElementById('faceInput').click()" style="padding: 15px;">
            <p id="faceText">👤 Upload Face to Swap (Source)</p>
            <input type="file" id="faceInput" accept="image/*" onchange="handleFace(event)">
        </div>

        <div class="preview-area">
            <div class="preview-box" id="targetPreview"><span>Target Preview</span></div>
            <div class="preview-box" id="facePreview"><span>Source Face</span></div>
        </div>

        <button class="action-btn" onclick="startProcess()">Start AI Face Swap</button>

        <div class="loader" id="loadingSpinner"></div>
        <div class="result-section" id="resultBox">
            <h3 style="margin-bottom: 10px; color: #22c55e;">Success! Face Swapped Successfully</h3>
            <button class="action-btn" style="background: #22c55e;" onclick="alert('Downloading file...')">Download Result</button>
        </div>
    </div>

    <script>
        let currentMode = 'photo';

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            const input = document.getElementById('fileInput');
            input.accept = mode === 'photo' ? 'image/*' : 'video/*';
            document.getElementById('uploadText').innerText = `📁 Click to upload Target ${mode === 'photo' ? 'Photo' : 'Video'}`;
        }

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const preview = document.getElementById('targetPreview');
            preview.innerHTML = '';
            const url = URL.createObjectURL(file);
            if (currentMode === 'photo') {
                const img = document.createElement('img');
                img.src = url;
                preview.appendChild(img);
            } else {
                const vid = document.createElement('video');
                vid.src = url;
                vid.controls = true;
                preview.appendChild(vid);
            }
        }

        function handleFace(event) {
            const file = event.target.files[0];
            if (!file) return;
            const preview = document.getElementById('facePreview');
            preview.innerHTML = '';
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            preview.appendChild(img);
        }

        function startProcess() {
            const spinner = document.getElementById('loadingSpinner');
            const resultBox = document.getElementById('resultBox');
            spinner.style.display = 'block';
            resultBox.style.display = 'none';

            setTimeout(() => {
                spinner.style.display = 'none';
                resultBox.style.display = 'block';
            }, 3000);
        }
    </script>
</body>
  </html>
