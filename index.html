<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevForgeHub - AI Face Changer Studio</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #22c55e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        header p {
            color: #94a3b8;
            font-size: 1rem;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .info-text {
            color: #cbd5e1;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.95rem;
        }
        .iframe-container {
            width: 100%;
            height: 650px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        footer {
            margin-top: 20px;
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>DevForgeHub AI</h1>
        <p>Advanced Real-Time Photo & Video Face Swap Engine</p>
    </header>

    <div class="container">
        <p class="info-text">Upload your target media and source face below to generate professional AI face swaps instantly with full download support.</p>
        
        <div class="iframe-container">
            <!-- Integrated High-Performance Public AI Face Swap Engine -->
            <iframe src="https://facefusion-facefusion.hf.space" title="AI Face Swap Engine"></iframe>
        </div>
    </div>

    <footer>
        &copy; 2026 DevForgeHub. All rights reserved. Powered by Advanced AI Infrastructure.
    </footer>

</body>
</html>
