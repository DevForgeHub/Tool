<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Defense & Aerospace News Channel</title>
    <style>
        :root {
            --news-red: #cc0000;
            --news-dark: #121212;
            --news-gray: #f4f4f4;
            --border-gray: #e0e0e0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: #fff;
            color: #222;
        }
        /* Top News Channel Header */
        .channel-header {
            background-color: var(--news-dark);
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid var(--news-red);
        }
        .channel-logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: #fff;
            color: #000;
            padding: 2px 12px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        /* Designed Pride Flag Bar */
        .pride-banner-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 4px;
        }
        .pride-banner-box span {
            font-size: 0.8rem;
            color: #ccc;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .pride-flag-stripe {
            width: 36px;
            height: 16px;
            border-radius: 2px;
            background: linear-gradient(to bottom, #e40303, #ff8c00, #ffed00, #008026, #004dff, #750787);
            box-shadow: 0 0 8px rgba(255,255,255,0.2);
        }
        .live-badge {
            color: #ff3b30;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 59, 48, 0.1);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 59, 48, 0.3);
        }
        .live-dot {
            width: 9px;
            height: 9px;
            background-color: #ff3b30;
            border-radius: 50%;
            animation: liveGlow 1.2s infinite;
        }
        @keyframes liveGlow {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* Breaking Ticker Bar */
        .breaking-ticker {
            background-color: var(--news-red);
            color: #fff;
            padding: 10px 30px;
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .breaking-tag {
            background: #000;
            color: #fff;
            padding: 3px 8px;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        /* Main Container */
        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .main-title {
            font-size: 1.6rem;
            border-bottom: 3px solid var(--news-red);
            padding-bottom: 8px;
            margin-bottom: 25px;
            font-weight: 800;
            text-transform: uppercase;
        }
        /* News Channel Grid Layout */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .news-card {
            background: #fff;
            border: 1px solid var(--border-gray);
            cursor: pointer;
            transition: 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .news-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            border-color: #333;
            transform: translateY(-2px);
        }
        .card-img-wrap {
            width: 100%;
            height: 190px;
            overflow: hidden;
            background: #111;
        }
        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }
        .news-card:hover .card-img-wrap img {
            transform: scale(1.04);
        }
        .card-content {
            padding: 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-category {
            font-size: 0.75rem;
            color: var(--news-red);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .card-content h3 {
            font-size: 1.2rem;
            color: #111;
            margin-bottom: 10px;
            line-height: 1.35;
        }
        .card-content p {
            font-size: 0.92rem;
            color: #555;
            line-height: 1.5;
        }
        /* Detailed News Article View */
        .article-view {
            background: var(--news-gray);
            border: 2px solid var(--news-dark);
            padding: 35px;
            margin-bottom: 40px;
            display: none;
        }
        .article-view h2 {
            color: var(--news-red);
            font-size: 2.1rem;
            margin-bottom: 12px;
            line-height: 1.2;
        }
        .article-meta {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 25px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 12px;
        }
        .article-body-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        @media(max-width: 768px) {
            .article-body-grid { grid-template-columns: 1fr; }
        }
        .article-text p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #222;
            margin-bottom: 18px;
        }
        .trending-sidebar {
            background: #fff;
            border-left: 4px solid var(--news-red);
            padding: 20px;
            border: 1px solid var(--border-gray);
        }
