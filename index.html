<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevForgeHub - AI Face Changer Studio</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #22c55e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 2.3rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .launch-btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
            transition: 0.3s ease;
        }
        .launch-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.6);
        }
        footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DevForgeHub AI</h1>
        <p>Welcome to the ultimate professional Photo & Video Face Swap Studio. Generate hyper-realistic AI face swaps and download instantly.</p>
        
        <a href="https://huggingface.co/spaces/facefusion/facefusion" target="_blank" class="launch-btn">
            🚀 Launch Live AI Studio
        </a>
    </div>

    <footer>
        &copy; 2026 DevForgeHub. All rights reserved.
    </footer>

</body>
</html>
